# FaltaUno - servicios locales de desarrollo
# Levantar:  docker compose up -d
# Detener:   docker compose down        (los datos se conservan en los volúmenes)
# Borrar todo, incluidos los datos:  docker compose down -v
#
# Si ya levantaste el entorno de la carpeta FaltaUno-entorno, detenelo primero
# (docker compose down en esa carpeta): este archivo usa los mismos nombres y suma Mailpit.

services:
  postgres:
    image: postgres:17
    container_name: faltauno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: faltauno
      POSTGRES_USER: faltauno
      POSTGRES_PASSWORD: faltauno_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    container_name: faltauno-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: faltauno
      MONGO_INITDB_ROOT_PASSWORD: faltauno_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: faltauno-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Correos de desarrollo: todo lo que envía la API se ve en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: faltauno-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Visor de la base: http://localhost:5050 (contraseña de la base: faltauno_dev)
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: faltauno-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@faltauno.uy
      PGADMIN_DEFAULT_PASSWORD: faltauno_dev
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: faltauno-n8n
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: America/Montevideo
      TZ: America/Montevideo
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  n8n_data:
  pgadmin_data:
